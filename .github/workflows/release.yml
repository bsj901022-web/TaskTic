# Builds the Windows installer with Velopack and publishes it as a GitHub Release.
# Trigger: push a tag like v0.6.0, or run manually with a version number.
# Installed copies of Taskbar Tails check this repository's releases and update themselves.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.6.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Releasing version $v"

      # Installer channel: framework-dependent (~10 MB). Velopack's Setup.exe installs the .NET 8 desktop runtime on demand.
      - name: Publish (framework-dependent win-x64)
        run: dotnet publish work/TaskbarTails/TaskbarTails.csproj -c Release -r win-x64 --self-contained false -p:Version=${{ env.VERSION }} -o publish

      # Extra asset for PCs where the runtime cannot be installed.
      - name: Publish (self-contained portable)
        shell: pwsh
        run: |
          dotnet publish work/TaskbarTails/TaskbarTails.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish-sc
          Compress-Archive -Path publish-sc\* -DestinationPath TaskbarTails-win-Portable-SelfContained.zip -Force

      # Diagnostic only: hosted runners have no real taskbar/desktop session, so this never blocks the release.
      # The release-gating smoke test is run locally before the tag is pushed. Results are written to the
      # public run summary and uploaded as an artifact so failures can be read without signing in.
      - name: Smoke test the published build (diagnostic)
        id: smoke
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          & .\publish\TaskbarTails.exe --smoke-test smoke
          $code = $LASTEXITCODE
          "## Smoke test on hosted runner (exit $code)" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path smoke\smoke-results.txt) { Get-Content smoke\smoke-results.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 } else { "smoke-results.txt was not written" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
          if (Test-Path publish\crash.log) { "--- crash.log ---" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8; Get-Content publish\crash.log | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8; Copy-Item publish\crash.log smoke\ }
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (Test-Path smoke\smoke-results.txt) { Get-Content smoke\smoke-results.txt }
          if ($code -ne 0) { throw "smoke test exited with $code (diagnostic only)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION }}
          path: smoke
          if-no-files-found: ignore

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Download previous releases (for delta packages)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --outputDir releases

      - name: Pack installer
        run: vpk pack --packId TaskbarTails --packVersion ${{ env.VERSION }} --packDir publish --mainExe TaskbarTails.exe --packTitle "Taskbar Tails" --packAuthors "bsj901022-web" --icon work/TaskbarTails/app.ico --framework net8.0-x64-desktop --outputDir releases

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## v$env:VERSION\b" | Select-Object -First 1).LineNumber
          if (-not $start) { "Taskbar Tails v$env:VERSION" | Out-File notes.md -Encoding utf8 }
          else {
            $body = @(); for ($i = $start; $i -lt $lines.Count; $i++) { if ($lines[$i] -match '^## ') { break }; $body += $lines[$i] }
            $body += ''; $body += 'Downloads: `TaskbarTails-win-Setup.exe` (installer, auto-updates) · `TaskbarTails-win-Portable.zip` (needs .NET 8 desktop runtime) · `TaskbarTails-win-Portable-SelfContained.zip` (runtime included)'
            $body | Out-File notes.md -Encoding utf8
          }
          Get-Content notes.md

      - name: Upload to GitHub Release
        run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --publish --releaseName "Taskbar Tails v${{ env.VERSION }}" --tag v${{ env.VERSION }} --outputDir releases

      - name: Attach notes and self-contained portable zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit v${{ env.VERSION }} --notes-file notes.md --repo ${{ github.repository }}
          gh release upload v${{ env.VERSION }} TaskbarTails-win-Portable-SelfContained.zip --clobber --repo ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarTails-${{ env.VERSION }}
          path: releases
